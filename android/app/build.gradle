plugins { id 'com.android.application' }

android {
    namespace 'com.ncrox.satanachia'
    compileSdk 35
    // Os mesmos banners/ UTF-8 usados no Python são empacotados como assets.
    sourceSets { main { assets.srcDir "$rootDir/../banners" } }
    defaultConfig {
        applicationId 'com.ncrox.satanachia'
        minSdk 30
        targetSdk 30
        versionCode 3
        versionName '1.2.0'
    }
}

dependencies {
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
}
